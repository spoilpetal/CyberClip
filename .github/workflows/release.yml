name: Build platform release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: cyberclip
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: cyberclip
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: cyberclip.exe
            archive: zip
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: cyberclip
            archive: tar.gz
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: cyberclip
            archive: tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} package/
          tar -C package -czf cyberclip-${{ github.ref_name }}-${{ matrix.name }}.tar.gz .
          shasum -a 256 cyberclip-${{ github.ref_name }}-${{ matrix.name }}.tar.gz > cyberclip-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/
          Compress-Archive -Path package/* -DestinationPath "cyberclip-${{ github.ref_name }}-${{ matrix.name }}.zip"
          $hash = (Get-FileHash "cyberclip-${{ github.ref_name }}-${{ matrix.name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  cyberclip-${{ github.ref_name }}-${{ matrix.name }}.zip" | Set-Content "cyberclip-${{ github.ref_name }}-${{ matrix.name }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cyberclip-${{ github.ref_name }}-${{ matrix.name }}
          path: |
            cyberclip-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: cyberclip-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release-assets/*
